services:
  api:
    build: .
    restart: unless-stopped
    environment:
      RAEBURN_START_SERVER: "true"
      NODE_ENV: production
      SERVICE_NAME: publishing-api
      DATABASE_URL: ${DATABASE_URL}
      SERVICE_SHARED_SECRET: ${SERVICE_SHARED_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      AI_PUBLISHING_ENABLED: ${AI_PUBLISHING_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-u7dpgaxh}
      CLOUDINARY_ASSET_FOLDER: ${CLOUDINARY_ASSET_FOLDER:-Cloudinary/The_Raeburn_Holding_Group_Ltd/news}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-The Raeburn Group <news@theraeburngroup.com>}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-contact@theraeburngroup.com}
      RESEND_SEGMENT_ID: ${RESEND_SEGMENT_ID:-c7674330-74b7-4c59-b5a3-783ba2690956}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-5.6-luna}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      RAEBURN_START_WORKER: "true"
      NODE_ENV: production
      SERVICE_NAME: publishing-worker
      DATABASE_URL: ${DATABASE_URL}
      SERVICE_SHARED_SECRET: ${SERVICE_SHARED_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      AI_PUBLISHING_ENABLED: ${AI_PUBLISHING_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-u7dpgaxh}
      CLOUDINARY_ASSET_FOLDER: ${CLOUDINARY_ASSET_FOLDER:-Cloudinary/The_Raeburn_Holding_Group_Ltd/news}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-The Raeburn Group <news@theraeburngroup.com>}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-contact@theraeburngroup.com}
      RESEND_SEGMENT_ID: ${RESEND_SEGMENT_ID:-c7674330-74b7-4c59-b5a3-783ba2690956}
      DISTRIBUTION_WEBHOOK_URL: ${DISTRIBUTION_WEBHOOK_URL}
      DISTRIBUTION_WEBHOOK_TOKEN: ${DISTRIBUTION_WEBHOOK_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-5.6-luna}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
