name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: TypeScript strict check
        run: npx --yes --package=typescript@5.8.3 tsc -p tsconfig.json --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run migrations:validate
      - run: npm run secrets:scan
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
